# N-301 spike: a CANDIDATE Anaconda profile for nisse (not shipped; N-304 ships the real one as an RPM).
# Anaconda detects a profile from the os-release ID only (ID_LIKE is not consulted), and nisse has ID=nisse.

[Profile]
profile_id = nisse
base_profile = fedora

[Profile Detection]
os_id = nisse

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
# Every mount point listed here becomes its own btrfs subvolume under the BTRFS scheme (the subvolume is named from the
# mount point: / -> root, /home -> home, /var/log -> var_log).
default_partitioning =
    /                (min 1 GiB, max 70 GiB)
    /home            (min 500 MiB, free 50 GiB)
    /var/log         (btrfs)
    /var/cache       (btrfs)
    /var/lib/nisse-models (btrfs)
