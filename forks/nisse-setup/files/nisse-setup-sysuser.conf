# sysusers.d file for creating the nisse-setup user, a special user
# that is allowed to bypass authentication when running setup tasks thanks to a
# polkit rule.
#
# /usr/lib/sysusers.d/nisse-setup.conf

u nisse-setup - "nisse setup" /run/nisse-setup /bin/sh
