# RPM Fusion free. Its signing keys ship in Fedora's distribution-gpg-keys package, so no key is downloaded.
id = "rpmfusion-free"
name = "RPM Fusion for Fedora $releasever - Free"
baseurl = "https://download1.rpmfusion.org/free/fedora/releases/$releasever/Everything/$basearch/os/"
key_file = "/usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-$releasever"
