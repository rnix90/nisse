# The nisse settings for the snapper "root" config (N-302 decision, N-305 verification). nisse-snapshot-setup passes each
# line to "snapper set-config" right after "snapper create-config /".
#
# Events only: no timed (hourly or daily) snapshots. Snapshots are taken around package transactions
# (nisse-snapshot-hook) and, later, around AI action batches and safe-apply.
TIMELINE_CREATE=no
TIMELINE_CLEANUP=no
# Keep the youngest 40 snapshots: snapper counts each pre and each post snapshot separately and keeps a pair together,
# so 40 is 20 pairs (verified in the build VM, docs/snapshots.md). Snapper's own cleanup timer enforces it hourly.
NUMBER_CLEANUP=yes
NUMBER_LIMIT=40
# Snapshots marked important are counted on their own; the same 20 pairs.
NUMBER_LIMIT_IMPORTANT=40
# A fresh snapshot is never removed in its first hour.
NUMBER_MIN_AGE=3600
# A pair with no change between pre and post is removed after an hour.
EMPTY_PRE_POST_CLEANUP=yes
EMPTY_PRE_POST_MIN_AGE=3600
