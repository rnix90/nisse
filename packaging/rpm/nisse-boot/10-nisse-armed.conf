# nisse: while a rollback is armed (nisse-boot arm), Fedora's "the boot was fine" marker must not run. It sets boot_success=1
# two minutes after any user logs in, which would stop the boot counter counting a boot that hangs after the login. Only
# nisse-boot clear, called by the health check, may say the boot was good while armed.
[Unit]
ConditionPathExists=!/var/lib/nisse/boot/armed
