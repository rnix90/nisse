# The nisse profile for the Anaconda installer (ledger N-301 spike, N-302 decision, N-304).
#
# Why it exists: Anaconda chooses its profile from the os-release ID only (ID_LIKE is not read), and nisse has ID=nisse.
# Without this file no profile matched, the installer fell back to LVM with ext4 and an EFI directory called "default"
# where the boot files are not, and the boot loader step failed (docs/storage-spike.md, docs/install-harness.md).
#
# The layout (N-302): the system subvolume "root" is snapshotted; "home", "var_log" and "var_cache" are separate
# subvolumes outside every snapshot, so a rollback leaves user data, logs and caches alone.

[Profile]
profile_id = nisse
base_profile = fedora

[Profile Detection]
os_id = nisse

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
# Under the BTRFS scheme every mount point listed here becomes its own subvolume, named from the mount point
# (/ is root, /var/log is var_log). Sizes are ignored on btrfs: all subvolumes share the one volume.
default_partitioning =
    /                (min 1 GiB, max 70 GiB)
    /home            (min 500 MiB, free 50 GiB)
    /var/log         (btrfs)
    /var/cache       (btrfs)
