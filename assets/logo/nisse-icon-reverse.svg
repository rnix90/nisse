<!-- Nisse icon (1:1): light mark for dark backgrounds -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nisse">
  <title>Nisse</title>
  <defs>
    <!-- Knockout mask: cap and hill line are transparent, so the mark works on any background. -->
    <mask id="knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g transform="translate(251 392) scale(2.4)" fill="#000">
      <path d="M-28 -10 C-24 -44 -16 -76 0 -102 C8 -116 30 -116 38 -102 C26 -106 18 -98 18 -88 C24 -66 28 -38 28 -10 Z"/>
      <rect x="-34" y="-18" width="68" height="18" rx="9"/>
      </g>
      <path d="M0 380 C120 330 200 320 256 322 C320 324 400 330 512 372 V512 H0 Z" fill="#fff" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
    </mask>
  </defs>
  <circle cx="256" cy="256" r="236" fill="#f6f2e9" mask="url(#knockout)"/>
</svg>
