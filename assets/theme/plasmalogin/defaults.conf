# The nisse default for the login screen (ledger N-503). Installed as /usr/lib/plasmalogin/defaults.conf, the distro defaults file that
# Plasma Login Manager (Fedora 44's display manager) reads under the administrator's /etc/plasmalogin.conf. The greeter is a Plasma
# session of its own, so its colors, font and icons already come from the system default /etc/xdg/kdeglobals; the wallpaper is the one
# thing that needs naming here. The greeter blurs it as soon as someone touches a key, and the dark picture is chosen by the nisse color scheme.
[Greeter]
WallpaperPlugin=org.kde.image
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/nisse
PreviewImage=file:///usr/share/wallpapers/nisse
